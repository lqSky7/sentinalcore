# Sentinal Analysis Framework Configuration

[analysis]
# Maximum analysis time in seconds
max_timeout = 300
# Default timeout for analysis
default_timeout = 30
# Maximum file size to analyze (in MB)
max_file_size = 100
# Maximum number of concurrent analyses
max_concurrent_analyses = 3

[monitoring]
# Enable process monitoring
enable_process_monitor = true
# Enable network monitoring
enable_network_monitor = true
# Enable memory forensics
enable_memory_analysis = true
# Maximum syscalls to capture
max_syscalls = 10000
# Maximum processes to track
max_processes = 500

[security]
# Allowed file extensions for analysis
allowed_extensions = .py,.sh,.elf,.out,.bin,.exe
# Blocked file paths (comma-separated patterns)
blocked_paths = /etc/,/usr/bin/,/bin/,/sbin/
# Enable sandboxing (requires additional setup)
enable_sandboxing = false
# Sandbox timeout
sandbox_timeout = 60
# Maximum memory usage (MB)
max_memory_usage = 1024

[network]
# Network monitoring duration
monitor_duration = 30
# Capture DNS queries
capture_dns = true
# Monitor suspicious ports
suspicious_ports = 1337,4444,5555,6666,8080,9999
# Block network access during analysis
block_network = false

[logging]
# Log level: DEBUG, INFO, WARNING, ERROR
log_level = INFO
# Log file location
log_file = /tmp/sentinal.log
# Rotate logs
rotate_logs = true
# Maximum log file size (MB)
max_log_size = 10

[paths]
# Temporary directory for analysis
temp_dir = /tmp/sentinal
# Output directory for results
output_dir = ./results
# Monitor binary location
monitor_binary = ./process_monitor

[visualization]
# Enable graph generation
enable_graphs = true
# Graph format: png, svg
graph_format = png
# Graph DPI
graph_dpi = 150
# Maximum nodes in process tree graph
max_graph_nodes = 100